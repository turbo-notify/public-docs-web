          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.baseUrl }}/v1/numbers/main/messages"
        name: Send Message (calendar)
        meta:
          id: req_msg_send_calendar
          created: 1777889700003
          modified: 1777889700003
          isPrivate: false
          description: Send a WhatsApp calendar/event invite (maps to WhatsApp `eventMessage`, exposed here as `calendar`). Anchor field is `start_at`; the variant is detected from field presence. Requires `name` and timezone-aware `start_at`. Optional `end_at` (must be > start_at), `description`, `join_link` (http/https), `location` (nested object), `has_reminder` + `reminder_offset_sec`, `extra_guests_allowed`.
          sortKey: -685
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "to": { "number": "{{ _.recipientPhone }}" },
              "content": {
                "name": "Sprint Planning",
                "description": "Planejamento da sprint 24.\n\n- Roadmap Q2\n- Capacity\n- Tech debt",
                "start_at": "2026-05-01T14:00:00Z",
                "end_at": "2026-05-01T15:00:00Z",
                "join_link": "https://meet.example.com/abc",
                "has_reminder": true,
                "reminder_offset_sec": 600,
                "location": {
                  "latitude": -23.5505,
                  "longitude": -46.6333,
                  "name": "HQ - Sala Mestre",
                  "address": "Avenida Paulista, São Paulo"
                }
              }
            }
        headers:
          - name: Content-Type
            value: application/json
            disabled: false
          - name: Idempotency-Key
            value: ""
            description: "Optional: prevent duplicate sends on retry"
            disabled: true
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            if (insomnia.response.code === 202) {
