      - url: "{{ _.baseUrl }}/v1/numbers/main/messages"
        name: Send Message (contact)
        meta:
          id: req_msg_send_contact
          created: 1777889700002
          modified: 1777889700002
          isPrivate: false
          description: Send a WhatsApp contact card. Anchor field is `display_name`; the variant is detected from field presence. Requires `display_name` and at least one phone (`phones[].label` defaults to "Mobile"). Optional `emails[]`, `organization`, `title`, `address`. The vCard is generated server-side, so clients never craft escaping themselves.
          sortKey: -690
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "to": { "number": "{{ _.recipientPhone }}" },
              "content": {
                "display_name": "João Silva",
                "phones": [
                  { "label": "Mobile", "number": "+5511988887777" },
                  { "label": "Work",   "number": "+551133334444" }
                ],
                "emails": [
                  { "label": "Work", "address": "joao@acme.com" }
                ],
                "organization": "Acme Corp",
                "title": "CTO",
                "address": "Av. Paulista 1578, São Paulo - SP"
              }
            }
        headers:
          - name: Content-Type
            value: application/json
            disabled: false
          - name: Idempotency-Key
            value: ""
            description: "Optional: prevent duplicate sends on retry"
            disabled: true
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            if (insomnia.response.code === 202) {
