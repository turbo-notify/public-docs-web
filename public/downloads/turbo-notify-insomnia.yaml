              description: "Register a new extra number (status: pending). Does NOT start pairing; use 'Pair Extra Number' next. Captures extraNumberAlias. BUSINESS+ only. FREE/SOLO get 402 `{\"error\": \"feature_not_available\"}`. Also enforces the tier's numeric cap (BUSINESS 1000 / CUSTOM 1000, counting your existing extra numbers): at the cap, returns 402 `{\"error\": \"extra_numbers_limit_reached\", \"message\": \"...\", \"details\": {\"limit\": <int>, \"current\": <int>}}`. The request triggers an immediate pro-rata activation charge BEFORE the number is created: no card on file returns 400 `{\"error\": \"no_payment_method\"}`; a declined/blocked charge returns 402 `{\"error\": \"payment_declined\"}` or 402 `{\"error\": \"payment_requires_authentication\"}`; a gateway timeout returns 503 `{\"error\": \"payment_gateway_unavailable\"}`. In every case, no number is created. Optional external_id: your own identifier for the number (1 to 128 characters, unique among your numbers); one already in use answers 409 `{\"error\": \"external_id_already_used\"}` and nothing is charged. Additions are limited per account over a rolling window: past it, 429 `{\"error\": \"number_creation_rate_limited\"}` with a Retry-After header (seconds to wait), and nothing is charged."
