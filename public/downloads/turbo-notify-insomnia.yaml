            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.baseUrl }}/v1/numbers/main/messages"
        name: Send Message (image)
        meta:
          id: req_msg_send_image
          created: 1777889700004
          modified: 1777889700004
          isPrivate: false
          description: Send a WhatsApp image. Anchor field is `image_url`; the variant is detected from field presence. Requires `image_url` (http/https). Optional `mime_type`, `caption`. The URL is fetched and the image is uploaded to WhatsApp before delivering. The `caption` accepts @mention tokens (`@<E.164 digits, no +>`, e.g. "Confere, @5511987650000?") with the same implicit-detection rules as text sends (see "Send Message (text + mention)"); video/document captions accept them too (audio/sticker have no caption).
