  - name: Events
    meta:
      id: fld_events
      created: 1776254400000
      modified: 1776254400000
      sortKey: -500
      description: Stripe-like event polling. Poll for async results (delivered, read, failed) instead of, or alongside, webhooks.
    children:
      - url: "{{ _.baseUrl }}/v1/events"
        name: List Events
        meta:
          id: req_events_list
          created: 1776254400010
          modified: 1776254400010
          isPrivate: false
          description: "Paginated event list. Available query params: limit (1-100, default 25), type, types[], request_id, created[gte], created[lte], starting_after (cursor), ending_before (cursor), number_alias (restrict results to one number, 'main' or an extra alias). Each item shares the same envelope {id, type, organization_id, number_alias, created_at, data} as the webhook body (byte-identical data). number_alias (directly below organization_id) is the Turbo Notify inbox handle the event belongs to ('main' or an extra number's alias string, never a UUID); it is present on events tied to a single number (message.*, number.*, group.*, contact.*, and both *.quota.* families, because contact and message quotas are per number) and omitted ONLY for storage.* (the sole account-wide event with no single owning number). Every event data is coherent with message.*: a flat top-level data.id (message -> msg_, contact -> id=ct_ [renamed from contact_id], group -> id=grp_ [flattened from group:{id,name}]; number.* has no data.id, alias is the handle) plus the tail channel:'whatsapp' + origin ('tn'|'native') + direction:'inbound' on all group.*/contact.*/*.picture_changed (no direction on number.* lifecycle, storage.*, *.quota.*). *.picture_changed serves a organization_storage picture as kind:'available' with a presigned url (presigned once at dispatch and stored in the event; polling serves the stored url, like message media). The from/to/participant party contact_id is unchanged. Timestamps: envelope `created_at` = when Turbo Notify emitted the event; `data.at` (when present) = the real WhatsApp action moment. They are distinct values, and for outbound message events (message.sent/replied/edited/deleted + *.failed) and the real-action number.* events (number.connected/disconnected/revoked/ connect.failed) `data.at` is the genuine WhatsApp moment, typically EARLIER than `created_at`. Three picture/snapshot events carry NO `data.at` (only the envelope `created_at`): contact.picture_changed, group.picture_changed, group.joined. All other group lifecycle events (group.name_changed, group.description_changed, group.settings_changed, group.participants_added/removed/promoted/demoted, group.left) DO carry `data.at`. Number reasons: number.disconnected always carries `data.reason` = connection_lost | service_interruption | replaced_by_another_device | disconnected_by_request; number.revoked carries logged_out_on_phone | replaced_by_another_device; number.connect.failed carries the pairing reasons of the number status. An outage Turbo Notify repairs by itself (connection_lost, service_interruption) is reported only if the number is not back within about a minute, so its `data.at` (the moment it went offline) can precede `created_at` by one to two minutes; back in time, neither number.disconnected nor number.connected is sent."
          sortKey: -400
        method: GET
        parameters:
          - name: limit
            value: "25"
            description: Number of events to return (1-100)
            disabled: false
          - name: type
            value: ""
            description: Filter by exact event type (e.g. message.delivered)
            disabled: true
          - name: types[]
            value: ""
            description: Filter by multiple event types (repeat for each)
            disabled: true
          - name: request_id
            value: "{{ _.requestId }}"
            description: Filter events by request ID
            disabled: true
          - name: created[gte]
            value: ""
            description: Events created at or after (ISO 8601, e.g. 2026-04-15T00:00:00Z)
            disabled: true
          - name: created[lte]
            value: ""
            description: Events created at or before (ISO 8601)
            disabled: true
          - name: starting_after
            value: ""
            description: "Cursor: event ID to start after (forward pagination, OLDER events)"
            disabled: true
          - name: ending_before
            value: ""
            description: "Cursor: event ID to end before (backward pagination, NEWER events; use this to catch up)"
            disabled: true
          - name: number_alias
            value: "{{ _.numberAlias }}"
            description: Restrict results to one number's inbox ('main' or an extra alias)
            disabled: true
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
    authentication:
      type: bearer
      token: "{{ _.apiKey }}"
