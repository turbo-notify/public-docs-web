type: collection.insomnia.rest/5.0
schema_version: "5.1"
name: Public API
meta:
  id: wrk_4377481903bc4404be6cfc39865fafe6
  created: 1774232422176
  modified: 1776254400000
  description: Turbo Notify Public API - WhatsApp messaging endpoints
collection:
  - name: Messages
    meta:
      id: fld_messages
      created: 1774240000000
      modified: 1780735070420
      sortKey: -600
      description: Send, edit, delete, react, and reply to WhatsApp messages
    children:
      - url: "{{ _.baseUrl }}/v1/numbers/main/messages"
        name: Send Message (interactive CTA)
        meta:
          id: req_msg_send_interactive
          created: 1748995200000
          modified: 1748995200000
          isPrivate: false
          description: 'Send a WhatsApp CTA-URL interactive message. Anchor field is `interactive_type`; the variant is detected from field presence. `interactive_type` is always `"cta_url"`. Required: `body` (message text, ≤1024 chars) and `url_button` (`display_text` ≤20 chars + `url`). Optional: `header` (`{"type": "text", "text": "..."}`), `footer` (≤60 chars).'
          sortKey: -656
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "to": { "number": "{{ _.recipientPhone }}" },
              "content": {
                "interactive_type": "cta_url",
                "body": "Clique aqui para ver sua fatura detalhada.",
                "header": { "type": "text", "text": "Fatura TurboNotify" },
                "footer": "turbonotify.com",
                "url_button": {
                  "display_text": "Ver fatura",
                  "url": "https://app.turbonotify.com/faturas/123"
                }
              }
            }
        headers:
          - name: Content-Type
            value: application/json
            disabled: false
          - name: Idempotency-Key
            value: ""
            description: "Optional: prevent duplicate sends on retry"
            disabled: true
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            if (insomnia.response.code === 202) {
              if (body.message_id) insomnia.environment.set("messageId", body.message_id);
              const reqId = insomnia.response.headers.find(h => h.name.toLowerCase() === "x-request-id");
              if (reqId) insomnia.environment.set("requestId", reqId.value);
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.baseUrl }}/v1/numbers/main/messages"
        name: Send Message (text)
        meta:
          id: req_msg_send_text
          created: 1774240000001
          modified: 1780706799835
          isPrivate: false
          description: "Send a text message via WhatsApp. Wire shape: variant is inferred from field presence inside `content`, no explicit `content_type` required. `to` is polymorphic by key presence: `{\"number\": \"+55...\"}` for 1:1, `{\"group_id\": \"grp_{hex32}\"}` for group. Sender is the number identified by {alias} in the URL path (default: 'main'). Response 202 returns message_id (msg_{hex32}); internal correlator in X-Request-ID header. For group sends, see \"Send Message (to group)\" above. If the organization's subscription is not active (past_due / terminated / an elapsed trial / no subscription row), every send (incl. Reply) returns 402 `{\"error\": \"subscription_inactive\", \"message\": \"...\", \"details\": {\"status\": \"past_due\"|\"terminated\"|\"trial_expired\"|\"missing\"}}` BEFORE any quota check runs. Before the message is sent the number appears online and the unread messages it received in that conversation are marked as read, as a person opening the chat would. Opening the chat this way is automatic, needs no configuration, uses no quota and creates no webhook event of its own, and adds no plan requirement. The number goes back offline by itself a few minutes after its last interaction."
          sortKey: -700
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "to": { "number": "{{ _.recipientPhone }}" },
              "content": {
                "text": "Hello from Turbo Notify! 3"
              }
            }
        headers:
          - name: Content-Type
            value: application/json
            description: ""
            disabled: false
          - name: Idempotency-Key
            value: ""
            description: "Optional: prevent duplicate sends on retry"
            disabled: true
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            if (insomnia.response.code === 202) {
              if (body.message_id) insomnia.environment.set("messageId", body.message_id);
              const reqId = insomnia.response.headers.find(h => h.name.toLowerCase() === "x-request-id");
              if (reqId) insomnia.environment.set("requestId", reqId.value);
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.baseUrl }}/v1/numbers/main/messages"
        name: Send Message (text + mention)
        meta:
          id: req_msg_send_text_mention
          created: 1783036800000
          modified: 1783036800000
          isPrivate: false
          description: "Send a text message with an @mention. Token rule: `@` + the mentioned contact's phone as E.164 digits WITHOUT `+` (7 to 15 digits, word-boundary guarded, so `name@domain.com` and `@+55...` never match), written directly in `text` (or a media `caption`). Detection is implicit: there is NO `mentions` request field; every valid token renders as a real tappable mention on the recipient's device. BR 12-digit tokens are normalized to the canonical 13-digit form; invalid digit runs stay plain text (fail-open). Mentions never consume message/contact quota. The persisted message carries a hydrated `mentions` array on GET detail and on the `message.sent`/`replied`/`edited` event `data`; each token counts as 1 character in `preview`. Works for 1:1 and group sends alike."
          sortKey: -695
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "to": { "number": "{{ _.recipientPhone }}" },
              "content": {
                "text": "Olá @5511987650000, seu pedido chegou!"
              }
            }
        headers:
          - name: Content-Type
            value: application/json
            description: ""
            disabled: false
          - name: Idempotency-Key
            value: ""
            description: "Optional: prevent duplicate sends on retry"
            disabled: true
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            if (insomnia.response.code === 202) {
              if (body.message_id) insomnia.environment.set("messageId", body.message_id);
              const reqId = insomnia.response.headers.find(h => h.name.toLowerCase() === "x-request-id");
              if (reqId) insomnia.environment.set("requestId", reqId.value);
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.baseUrl }}/v1/numbers/{{ _.numberAlias }}/messages/{{ _.messageId }}/edit"
        name: Edit Message
        meta:
          id: req_msg_edit
          created: 1774240000002
          modified: 1776254400000
          isPrivate: false
          description: Edit a previously sent message by its public message_id (msg_{hex32}). Returns 202; result via webhook `message.edited` carrying `preview` (≤50-grapheme crop, renamed from `new_preview` on 2026-05-06). After the edit succeeds, `GET /v1/messages/{id}` returns the new body (the original row is patched in place). Channel-side edits (typed on the WhatsApp app) are also surfaced as `message.edited` and persisted via native decrypt of WhatsApp's `secretEncryptedMessage` envelope. Response body returns message_id; internal correlator is in X-Request-ID header. Before the edit the number appears online and the unread messages it received in that conversation are marked as read. Opening the chat this way is automatic and uses no quota and creates no webhook event of its own.
          sortKey: -600
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "text": "Updated message content"
            }
        headers:
          - name: Content-Type
            value: application/json
            description: ""
            disabled: false
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            if (insomnia.response.code === 202) {
              if (body.message_id) insomnia.environment.set("messageId", body.message_id);
              const reqId = insomnia.response.headers.find(h => h.name.toLowerCase() === "x-request-id");
              if (reqId) insomnia.environment.set("requestId", reqId.value);
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.baseUrl }}/v1/numbers/{{ _.numberAlias }}/messages/{{ _.messageId }}/react"
        name: React to Message
        meta:
          id: req_msg_react
          created: 1774240000003
          modified: 1776254400000
          isPrivate: false
          description: "Add or remove a reaction emoji on a message. Sender is the number identified by {alias} in the URL (default: 'main'). Empty 'reaction' removes the reaction. Response returns message_id and reaction_event_id. Before the reaction the number appears online and the unread messages it received in that conversation are marked as read. Opening the chat this way is automatic and uses no quota and creates no webhook event of its own."
          sortKey: -400
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "reaction": "\uD83D\uDE4F"
            }
        headers:
          - name: Content-Type
            value: application/json
            description: ""
            disabled: false
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            if (insomnia.response.code === 202) {
              if (body.reaction_event_id) insomnia.environment.set("reactionEventId", body.reaction_event_id);
              if (body.message_id) insomnia.environment.set("messageId", body.message_id);
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.baseUrl }}/v1/numbers/{{ _.numberAlias }}/messages/{{ _.messageId }}/delete"
        name: Delete Message
        meta:
          id: req_msg_delete
          created: 1776254400001
          modified: 1776254400001
          isPrivate: false
          description: Revoke a previously sent message by its public message_id (msg_{hex32}). Returns 202; result via webhook (message.deleted). Response body returns message_id; internal correlator is in X-Request-ID header. Before the deletion the number appears online and the unread messages it received in that conversation are marked as read. Opening the chat this way is automatic and uses no quota and creates no webhook event of its own.
          sortKey: -500
        method: POST
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            if (insomnia.response.code === 202) {
              if (body.message_id) insomnia.environment.set("messageId", body.message_id);
              const reqId = insomnia.response.headers.find(h => h.name.toLowerCase() === "x-request-id");
              if (reqId) insomnia.environment.set("requestId", reqId.value);
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.baseUrl }}/v1/numbers/{{ _.numberAlias }}/messages?limit=20"
        name: List Messages
        meta:
          id: req_msg_list
          created: 1782700800000
          modified: 1782700800000
          isPrivate: false
          description: "List messages for the inbox {numberAlias} (default 'main'), most-recent first. Cursor-paginated: pass `limit` (1-200) and the opaque `cursor` returned as `cursor` in the previous page; the response is { data: [...], cursor, has_more }. The flat `/v1/messages` list mirrors the nested one. Scope: messages:read."
          sortKey: -210
        method: GET
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.baseUrl }}/v1/numbers/{{ _.numberAlias }}/messages/{{ _.messageId }}/status"
        name: Get Message Status
        meta:
          id: req_msg_status
          created: 1776254400002
          modified: 1776254400002
          isPrivate: false
          description: "Get delivery status for a message by its public message_id (msg_{hex32}). Possible states: pending, sent, delivered, read, failed. Uses messageId captured from Send / Reply / Edit / Delete / React."
          sortKey: -200
        method: GET
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.baseUrl }}/v1/numbers/{{ _.numberAlias }}/messages/{{ _.messageId }}"
        name: Get Message Details
        meta:
          id: req_msg_details
          created: 1776254400003
          modified: 1776254400003
          isPrivate: false
          description: "Retrieve the full details of a message: id, organization_id, number_alias, direction, from/to, content_type, the named content field (text/image/...), preview, status, and timestamps. Example response: { id: 'msg_01993c5a1b24d3e9f01a2b3c4d5e6f70', organization_id: 'org_...', number_alias: 'main', direction: 'outbound', from: { number: '5511973117056', alias: 'main', name: 'Turbo Notify' }, to: { number: '5511999999999', name: 'João' }, content_type: 'text', text: 'Olá, seu pedido foi confirmado!', preview: 'Olá, seu pedido foi confirmado!', channel: 'whatsapp', origin: 'tn', at: '2026-04-21T10:00:05Z', status: { state: 'delivered', at: '2026-04-21T10:01:00Z' } }. The top-level `at` is the message's STABLE occurrence moment (outbound: the real WhatsApp send moment; inbound: the WhatsApp receive moment). It does NOT change as the message advances sent -> delivered -> read. The nested `status.at` is the CURRENT delivery-status time and ADVANCES with each transition (moves forward to delivered, then read). GET /v1/messages/{id}/status returns the same `status.at`. Uses messageId captured from Send / Reply / Edit / Delete / React."
          sortKey: -190
        method: GET
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.baseUrl }}/v1/numbers/{{ _.numberAlias }}/messages/{{ _.messageId }}/reactions"
        name: Get Message Reactions
        meta:
          id: req_msg_reactions
          created: 1776254400010
          modified: 1780705571388
          isPrivate: false
          description: "List active reactions on a message (addressed by public message_id msg_{hex32}). Returns one entry per reactor phone number; the last emoji wins (upsert semantics). Each reaction includes: from.number, from.contact_id (ct_{hex32} or null), from.name (WhatsApp name or null), emoji, at (ISO 8601 UTC timestamp), direction (inbound | outbound). Scope: messages:read. Uses messageId captured from Send / Reply / Edit / Delete / React."
          sortKey: -210
        method: GET
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.baseUrl }}/v1/numbers/{{ _.numberAlias }}/messages/{{ _.messageId }}/receipts"
        name: Get Message Receipts
        meta:
          id: req_msg_receipts
          created: 1776254400011
          modified: 1776254400011
          isPrivate: false
          description: "List delivery receipt history for a message (addressed by public message_id msg_{hex32}). Returns status transitions in chronological order (delivered → read). Each receipt includes: status (delivered | read) and at (ISO 8601 UTC timestamp). Note: only WhatsApp-confirmed acks (delivered + read) are tracked here. For sent status, use GET /v1/messages/{id}/status. Scope: messages:read. Uses messageId captured from Send / Reply / Edit / Delete / React. Requires BUSINESS or above. FREE/SOLO get 402 `feature_not_available`. The overall message status (GET .../status) stays available on every plan. Only this granular per-status receipt log is gated."
          sortKey: -205
        method: GET
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.baseUrl }}/v1/numbers/main/messages"
        name: Send Message (location)
        meta:
          id: req_msg_send_location
          created: 1777889700001
          modified: 1777889700001
          isPrivate: false
          description: Send a WhatsApp location pin. Anchor field is `latitude`; the variant is detected from field presence. `latitude` (-90..90) and `longitude` (-180..180) required. Optional `name`, `address`, and `url` (http/https only). The recipient sees the WhatsApp native location card with map preview.
          sortKey: -695
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "to": { "number": "{{ _.recipientPhone }}" },
              "content": {
                "latitude": -23.5505,
                "longitude": -46.6333,
                "name": "Avenida Paulista",
                "address": "São Paulo, SP, Brasil",
                "url": "https://maps.google.com/?q=-23.5505,-46.6333"
              }
            }
        headers:
          - name: Content-Type
            value: application/json
            disabled: false
          - name: Idempotency-Key
            value: ""
            description: "Optional: prevent duplicate sends on retry"
            disabled: true
        scripts:
          afterResponse: |-
            const body = insomnia.response.json();
            if (insomnia.response.code === 202) {
              if (body.message_id) insomnia.environment.set("messageId", body.message_id);
              const reqId = insomnia.response.headers.find(h => h.name.toLowerCase() === "x-request-id");
